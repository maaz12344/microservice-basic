
services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: your_local_mongo_user
      MONGO_INITDB_ROOT_PASSWORD: your_local_mongo_password
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "3002:3002"
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3003:3003"
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
